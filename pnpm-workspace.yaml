allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  bun: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  puppeteer: true
  sharp: true

minimumReleaseAge: 10080

packages:
  - "apps/*"
  - "packages/*"
  - "packages/udecode/*"

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@swc/core@1.12.0"
  - "chokidar@4.0.3"
  - "express-rate-limit@8.3.0"
  - "mermaid@10.9.3"
  - "semver@6.3.1"
  - "undici-types@6.21.0"

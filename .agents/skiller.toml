# Default agents to apply when --agents flag is not specified
default_agents = ["claude-code", "codex"]

# --- Fork Configuration ---

[rules]
merge_strategy = "cursor"

[backup]
enabled = false

# --- Global Configuration ---

[skills]
enabled = true

# Automatic .gitignore management
[gitignore]
enabled = false

# --- Agent-Specific Configuration ---

[agents.claude-code]
enabled = true

[agents.codex]
enabled = true

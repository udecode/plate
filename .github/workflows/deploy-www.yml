name: Deploy www

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-www-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'udecode/plate' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: preview-next
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 64.5.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether the site changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-www.yml/runs?branch=next&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)"
            if [[ -n "$base" ]] && git fetch --no-tags --depth=1 origin "$base"; then
              if git diff --quiet "$base" "$GITHUB_SHA" -- .github/workflows/deploy-www.yml; then
                set +e
                VERCEL_GIT_PREVIOUS_SHA="$base" VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" node apps/www/scripts/vercel-ignore-build.mjs
                result=$?
                set -e
                case "$result" in
                  0) build=false ;;
                  1) build=true ;;
                  *) exit "$result" ;;
                esac
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Check deployment configuration
        if: steps.changes.outputs.build == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo '::error::Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the preview-next environment.'
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.changes.outputs.build == 'true'
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.build == 'true'
        with:
          cache: true

      - name: Restore build cache
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/www/.next/cache
            .vercel/cache
          key: www-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            www-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install Vercel CLI
        if: steps.changes.outputs.build == 'true'
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Pull next preview settings
        if: steps.changes.outputs.build == 'true'
        run: vercel pull --yes --environment=preview --git-branch=next
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build deployment
        if: steps.changes.outputs.build == 'true'
        env:
          PLATE_BUILD_BASIC: '0'
        run: |
          nproc
          free -m
          uptime
          vercel build

      - name: Upload deployment without assigning domains
        if: steps.changes.outputs.build == 'true'
        id: deploy
        run: |
          git checkout --detach "$GITHUB_SHA"
          url="$(vercel deploy --prebuilt --archive=tgz --meta plateCommitRef=next --meta githubCommitSha="$GITHUB_SHA")"
          DEPLOYMENT_URL="$url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check deployed routes
        if: steps.changes.outputs.build == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 180 "$DEPLOYMENT_URL/" > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 180 "$DEPLOYMENT_URL/docs/installation/react" > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 180 "$DEPLOYMENT_URL/api/search?query=controlled&locale=en" | jq --exit-status 'type == "array" and length > 0' > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 180 "$DEPLOYMENT_URL/r/installation-docs.json" | jq --exit-status '.files | length > 0' > /dev/null

      - name: Assign the current next deployment to beta
        if: steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/next" --jq .object.sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'A newer next commit exists; leaving the beta domain unchanged.'
            exit 1
          fi
          vercel alias set "$DEPLOYMENT_URL" beta.platejs.org
          echo "Deployed $GITHUB_SHA to https://beta.platejs.org" >> "$GITHUB_STEP_SUMMARY"

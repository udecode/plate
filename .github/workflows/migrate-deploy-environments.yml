name: Migrate deployment environments

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    if: github.repository == 'udecode/plate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: preview-next
      deployment: false
    steps:
      - name: Install sealed-box encryption
        run: npm install --prefix "$RUNNER_TEMP/seal" --ignore-scripts --no-audit --no-fund libsodium-wrappers@0.7.15
      - name: Encrypt the existing credential for each destination
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_KEYS: '[{"name": "Beta", "key_id": "3380204578043523366", "key": "Ua3orwi/p7tmFDs/IGMUhiH3YmYNYdL2i/nQeNHovVI="}, {"name": "Production", "key_id": "3380204578043523366", "key": "nuoES1HhrwYcXRsXBvI/y2iSiY7CTbWO2XOVLK3a/Dk="}]'
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const require = createRequire(join(process.env.RUNNER_TEMP, 'seal/package.json'));
          const sodium = require('libsodium-wrappers');
          await sodium.ready;
          if (!process.env.VERCEL_TOKEN) throw new Error('Missing existing deployment credential');
          const values = JSON.parse(process.env.TARGET_KEYS).map(({ name, key, key_id }) => ({
            name,
            key_id,
            encrypted_value: Buffer.from(sodium.crypto_box_seal(
              Buffer.from(process.env.VERCEL_TOKEN, 'utf8'),
              Buffer.from(key, 'base64')
            )).toString('base64'),
          }));
          writeFileSync(join(process.env.RUNNER_TEMP, 'sealed-environment-secrets.json'), JSON.stringify(values));
          JS
      - name: Store destination-encrypted values
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-environment-secrets
          path: ${{ runner.temp }}/sealed-environment-secrets.json
          retention-days: 1

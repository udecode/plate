name: PR Body Check

on:
  pull_request:
    branches: [next]
    types: [opened, edited, synchronize, reopened]
  pull_request_target:
    branches: [next]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

concurrency:
  group: pr-body-check-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'udecode/plate' && github.event.pull_request.user.login != 'zbeyens' && github.event.pull_request.user.type != 'Bot' && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository)
      )

    steps:
      - name: Check the PR body
        uses: actions/github-script@v8
        with:
          script: |
            const MARKER = '<!-- pr-body-check -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            // A rerun judges the body as it is now, not as the event that started the run saw it.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            // GitHub's editor saves CRLF, which the section match below would miss.
            const body = (pr.body ?? '').replace(/\r\n/g, '\n');
            const uncommented = body.replace(/<!--[\s\S]*?-->/gu, '');
            const filled = (name) => {
              const section = uncommented.match(new RegExp(`^## ${name}[ \\t]*\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))`, 'mu'));
              return Boolean(section) && section[1].trim() !== '';
            };
            const missing = ['Why', 'Verification'].filter((name) => !filled(name)).map((name) => `a \`## ${name}\` section with text`);
            const passed = missing.length === 0 || /^Status:/mu.test(uncommented);

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const mine = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(MARKER));
            const post = async (text) => {
              const next = `${MARKER}\n${text}`;
              try {
                if (!mine) await github.rest.issues.createComment({ owner, repo, issue_number: number, body: next });
                else if (mine.body !== next) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: next });
              } catch (error) {
                core.warning(`Could not write the PR comment: ${error.message}`);
              }
            };

            if (passed) {
              core.info('The PR body has its plan Markdown, or its Why and Verification sections.');
              if (mine) await post('### PR body check passes\n\nThe body now has its plan Markdown, or its Why and Verification sections.');
              return;
            }

            const text = [
              '### PR body check fails',
              '',
              `This body lacks ${new Intl.ListFormat('en').format(missing)}. Add those sections to the PR description (or open the PR with \`node .agents/pstack/land.mjs\`), and the check runs again on the edit.`,
            ].join('\n');
            await post(text);
            core.setFailed(text);

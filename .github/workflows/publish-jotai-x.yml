# First publish of @lofcz/jotai-x. Existing Plate packages use OIDC trusted
# publishing; a brand-new npm package is not in that allow-list, so this job
# uses NPM_TOKEN once. After the package exists, add GitHub Actions as a
# trusted publisher on npm and future releases can go through release.yml.
name: Publish jotai-x

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish @lofcz/jotai-x
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'lofcz/plate' }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          link-workspace-packages: 'true'

      - name: Setup Node.js registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@lofcz'

      - name: Build jotai-x
        run: pnpm --filter @lofcz/jotai-x build

      - name: Publish jotai-x
        working-directory: packages/udecode/jotai-x
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

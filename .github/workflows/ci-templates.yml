name: CI Templates

on:
  workflow_call:
    inputs:
      regenerate:
        description: Regenerate templates from registry and package sources before checking.
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/**'
      - '.github/workflows/ci-templates.yml'
      - '.github/workflows/release.yml'
      - 'tooling/scripts/check-templates*'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.github/workflows/ci-templates.yml'
      - '.github/workflows/release.yml'
      - 'tooling/scripts/check-templates*'

concurrency:
  group: ${{ github.workflow }}-templates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Verify templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        if: ${{ !inputs.regenerate }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monorepo install
        if: inputs.regenerate
        uses: ./.github/actions/pnpm-install
        with:
          link-workspace-packages: 'true'

      - name: Verify checker failure handling
        run: node --test tooling/scripts/check-templates.integration.mjs

      - name: Build registry
        if: inputs.regenerate
        run: pnpm --filter www build:registry && pnpm --filter www build:tw && pnpm --filter www rd

      - name: Regenerate templates
        if: inputs.regenerate
        env:
          TEMPLATE_SKIP_VERIFY: 'true'
        run: pnpm templates:update --local

      - name: Use local packages for PR verification
        if: inputs.regenerate && github.event_name == 'pull_request'
        env:
          TEMPLATE_LOCAL_PACKAGE_BASE_REF: origin/${{ github.base_ref }}
        run: node tooling/scripts/prepare-local-template-packages.mjs templates/plate-template templates/plate-playground-template

      - name: Verify templates
        run: bash tooling/scripts/check-templates.sh

name: CI Templates

on:
  workflow_call:
    inputs:
      skip-committed-check:
        description: Registry source changes are validated through generated output.
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/**'
      - '.github/workflows/ci-templates.yml'
      - '.github/workflows/release.yml'
      - 'tooling/scripts/check-templates*'
      - 'tooling/scripts/update-template*'
      - 'tooling/scripts/prepare-local-template*'
      - 'tooling/templates/**'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.github/workflows/ci-templates.yml'
      - '.github/workflows/release.yml'
      - 'tooling/scripts/check-templates*'
      - 'tooling/scripts/update-template*'
      - 'tooling/scripts/prepare-local-template*'
      - 'tooling/templates/**'

permissions:
  contents: read

jobs:
  ci:
    name: Regenerate, lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Monorepo install
        uses: ./.github/actions/pnpm-install
        with:
          link-workspace-packages: 'true'

      - name: Verify checker failure handling
        run: node --test tooling/scripts/check-templates.integration.mjs

      - name: Verify committed templates
        if: ${{ !inputs.skip-committed-check }}
        run: bash tooling/scripts/check-templates.sh

      - name: Build registry
        run: pnpm --filter www build:registry && pnpm --filter www build:tw && pnpm --filter www rd

      - name: Regenerate templates
        env:
          TEMPLATE_SKIP_VERIFY: 'true'
        run: pnpm templates:update --local

      - name: Use local packages for PR verification
        if: github.event_name == 'pull_request'
        env:
          TEMPLATE_LOCAL_PACKAGE_BASE_REF: origin/${{ github.base_ref }}
        run: node tooling/scripts/prepare-local-template-packages.mjs templates/plate-template templates/plate-playground-template

      - name: Verify templates
        run: bash tooling/scripts/check-templates.sh
